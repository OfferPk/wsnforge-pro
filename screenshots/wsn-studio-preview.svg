<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#studioBg)" />

  <!-- Window Header -->
  <rect x="0" y="0" width="960" height="42" fill="#090e17" stroke="#1e293b" stroke-width="1" />
  <circle cx="20" cy="21" r="5" fill="#ef4444" />
  <circle cx="36" cy="21" r="5" fill="#eab308" />
  <circle cx="52" cy="21" r="5" fill="#22c55e" />
  <text x="480" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="600">
    WSNForge Pro — CCSDS 882.0-M-1 Spacecraft Wireless Sensor Network Studio
  </text>
  <rect x="820" y="10" width="125" height="22" rx="4" fill="#065f46" />
  <text x="882" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34d399" text-anchor="middle" font-weight="700">100% COMPLIANT</text>

  <!-- Telemetry Bar -->
  <g transform="translate(24, 56)">
    <!-- Tile 1 -->
    <rect x="0" y="0" width="215" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">WSN SENSOR NODES</text>
    <text x="16" y="48" font-family="monospace" font-size="20" fill="#38bdf8" font-weight="bold">4 NODES</text>

    <!-- Tile 2 -->
    <rect x="230" y="0" width="215" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="246" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">SUPERFRAME DUTY</text>
    <text x="246" y="48" font-family="monospace" font-size="20" fill="#4ade80" font-weight="bold">12.5% CYCLE</text>

    <!-- Tile 3 -->
    <rect x="460" y="0" width="215" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="476" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">HARNESS MASS SAVED</text>
    <text x="476" y="48" font-family="monospace" font-size="20" fill="#facc15" font-weight="bold">8.04 kg</text>

    <!-- Tile 4 -->
    <rect x="690" y="0" width="220" height="60" rx="6" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="706" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-transform="uppercase" font-weight="bold">SOIS WSN AUDIT</text>
    <text x="706" y="48" font-family="monospace" font-size="20" fill="#34d399" font-weight="bold">10 / 10 PASS</text>
  </g>

  <!-- Main Left Column: Control Deck -->
  <g transform="translate(24, 130)">
    <rect x="0" y="0" width="280" height="385" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f8fafc" font-weight="bold">WSN CONTROLLER DECK</text>
    <line x1="16" y1="36" x2="264" y2="36" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">TARGET SENSOR NODE</text>
    <rect x="16" y="66" width="248" height="28" rx="4" fill="#070c14" stroke="#334155" stroke-width="1" />
    <text x="26" y="84" font-family="monospace" font-size="10" fill="#cbd5e1">0x0101: Fairing Strain Gauge Array</text>

    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">SUPERFRAME SCHEDULE</text>
    <rect x="16" y="120" width="248" height="28" rx="4" fill="#070c14" stroke="#334155" stroke-width="1" />
    <text x="26" y="138" font-family="monospace" font-size="10" fill="#cbd5e1">SO=3 (123ms), BO=6 (983ms)</text>

    <text x="16" y="166" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">MAC SLOT ALLOCATION</text>
    <rect x="16" y="174" width="248" height="28" rx="4" fill="#070c14" stroke="#334155" stroke-width="1" />
    <text x="26" y="192" font-family="monospace" font-size="10" fill="#cbd5e1">GTS Slot 9 (Contention Free)</text>

    <!-- Action Buttons -->
    <rect x="16" y="218" width="248" height="32" rx="4" fill="#0284c7" />
    <text x="140" y="238" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">ACQUIRE WIRELESS TELEMETRY</text>

    <rect x="16" y="260" width="248" height="32" rx="4" fill="#059669" />
    <text x="140" y="280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">ENCAPSULATE SPACE PACKET</text>

    <rect x="16" y="302" width="248" height="32" rx="4" fill="#7c3aed" />
    <text x="140" y="322" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">CALCULATE HARNESS SAVINGS</text>

    <!-- Info Status -->
    <rect x="16" y="344" width="248" height="28" rx="4" fill="#0b1320" stroke="#1e293b" />
    <text x="26" y="362" font-family="monospace" font-size="9" fill="#10b981">802.15.4 FCF: 0x8849 • AES-128 CCM*</text>
  </g>

  <!-- Right Top: Dissection Viewer -->
  <g transform="translate(320, 130)">
    <rect x="0" y="0" width="616" height="180" rx="8" fill="#050811" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="616" height="26" rx="8" fill="#090e17" />
    <text x="16" y="17" font-family="monospace" font-size="10" fill="#64748b">IEEE 802.15.4 MPDU &amp; CCSDS SPACE PACKET GATEWAY</text>

    <g font-family="monospace" font-size="10" fill="#38bdf8">
      <text x="16" y="48">Sensor Node:          Fairing Strain Gauge Array #1 [0x0101]</text>
      <text x="16" y="68">Acquired Telemetry:   245.00 microstrain (Raw ADC: 0x0992)</text>
      <text x="16" y="88">GTS Slot Timing:      Slot 9 (Contention Free Period, 7.68 ms)</text>
      <text x="16" y="108" fill="#4ade80">IEEE 802.15.4 MPDU:   498801208801000101010000000101010992A1B2C3D426C8 (24B)</text>
      <text x="16" y="128" fill="#4ade80">Security Header:      AES-128 CCM* MIC-32, Frame Counter=1</text>
      <text x="16" y="148" fill="#facc15">CCSDS Space Packet:   0382C001000B69F53B4B01010992 (14B, APID 0x382)</text>
      <text x="16" y="168" fill="#a855f7">Secondary Header:     SCET Timestamp CUC Seconds Time-Tagged</text>
    </g>
  </g>

  <!-- Right Bottom: Telemetry Log -->
  <g transform="translate(320, 325)">
    <rect x="0" y="0" width="616" height="190" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#f8fafc" font-weight="bold">SPACECRAFT WSN SUPERFRAME DISPATCH LOG</text>
    <line x1="16" y1="34" x2="600" y2="34" stroke="#1e293b" stroke-width="1" />

    <g font-family="monospace" font-size="9" fill="#94a3b8">
      <text x="16" y="52" fill="#38bdf8">[08:09:01.100] WSNForge Pro v1.0.0 Online. Standard: CCSDS 882.0-M-1.</text>
      <text x="16" y="70" fill="#cbd5e1">[08:09:01.115] [WSN] PAN Coordinator 0x0001 active on 2.4 GHz DSSS Channel 15.</text>
      <text x="16" y="88" fill="#4ade80">[08:09:02.001] [SUPERFRAME] Beacon interval 983ms, SD 123ms (12.5% energy duty cycle).</text>
      <text x="16" y="106" fill="#cbd5e1">[08:09:02.110] --&gt; GTS Slot 9: Acquired 245.0 microstrain from Fairing Strain Gauge 0x0101.</text>
      <text x="16" y="124" fill="#4ade80">[08:09:02.118] &lt;-- Encapsulated into CCSDS Space Packet APID 0x382 (SCET Time-Tagged).</text>
      <text x="16" y="142" fill="#facc15">[08:09:03.001] [HARNESS] 48-Sensor Configuration: Net dry mass saved: 8.04 kg (91.8%).</text>
      <text x="16" y="160" fill="#a855f7">[08:09:04.100] [AUDIT] 10/10 Normative Requirements Verified PASS (100.0% Compliant).</text>
      <text x="16" y="178" fill="#34d399">[08:09:05.000] Status: CCSDS_882_0_WSN_CERTIFIED.</text>
    </g>
  </g>
</svg>
