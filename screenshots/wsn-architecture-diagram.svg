<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0e4459" />
    </linearGradient>
    <linearGradient id="boxGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,60 L 960,60 M 0,120 L 960,120 M 0,180 L 960,180 M 0,240 L 960,240 M 0,300 L 960,300 M 0,360 L 960,360 M 0,420 L 960,420 M 0,480 L 960,480" />
    <path d="M 120,0 L 120,540 M 240,0 L 240,540 M 360,0 L 360,540 M 480,0 L 480,540 M 600,0 L 600,540 M 720,0 L 720,540 M 840,0 L 840,540" />
  </g>

  <!-- Title Section -->
  <text x="480" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    WSNFORGE PRO — CCSDS 882.0-M-1 ARCHITECTURE
  </text>
  <text x="480" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    SOIS LOW DATA-RATE WIRELESS COMMUNICATIONS FOR SPACECRAFT MONITORING &amp; CONTROL
  </text>

  <!-- Layer 1: Spacecraft OBC / SOIS Subsystem -->
  <rect x="80" y="100" width="800" height="60" rx="8" fill="url(#boxGrad1)" stroke="#334155" stroke-width="2" />
  <text x="480" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">
    Onboard Computer (OBC) • SOIS Device Access Service (DAS) • Structural Health Monitoring
  </text>
  <text x="480" y="146" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    CCSDS Space Packet Telemetry (APID 0x382) • SCET Time-Tagged Secondary Header
  </text>

  <!-- Arrow -->
  <line x1="480" y1="160" x2="480" y2="200" stroke="#38bdf8" stroke-width="2" />
  <text x="480" y="185" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Space Packet Gateway Encapsulation (CCSDS 133.0-B-2)</text>

  <!-- Layer 2: Spacecraft WSN Gateway & Protocol Engine -->
  <rect x="80" y="200" width="800" height="110" rx="8" fill="url(#boxGradCyan)" stroke="#0284c7" stroke-width="2" />
  <text x="100" y="226" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">
    Spacecraft PAN Coordinator &amp; WSN Protocol Stack (CCSDS 882.0-M-1)
  </text>

  <!-- Submodules -->
  <rect x="100" y="240" width="180" height="55" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1.5" />
  <text x="190" y="262" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Superframe Scheduler</text>
  <text x="190" y="280" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">SO=3 / BO=6 (12.5% Duty)</text>

  <rect x="300" y="240" width="180" height="55" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1.5" />
  <text x="390" y="262" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">GTS Slot Arbiter</text>
  <text x="390" y="280" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">7 CFP Slots (Deterministic)</text>

  <rect x="500" y="240" width="180" height="55" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1.5" />
  <text x="590" y="262" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">AES-128 CCM*</text>
  <text x="590" y="280" font-family="monospace" font-size="10" fill="#facc15" text-anchor="middle">Counter + MIC-32</text>

  <rect x="700" y="240" width="160" height="55" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1.5" />
  <text x="780" y="262" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Harness Sizer</text>
  <text x="780" y="280" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">&gt;80% Mass Saved</text>

  <!-- Layer 3: Physical Spectrum & MAC Framing -->
  <rect x="80" y="340" width="800" height="70" rx="8" fill="url(#boxGrad1)" stroke="#334155" stroke-width="2" />
  <text x="480" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">
    IEEE 802.15.4 Physical Layer &amp; Superframe Structure
  </text>
  <g font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">
    <text x="210" y="390">Beacon (Slot 0)</text>
    <text x="480" y="390">Contention Access Period (CAP: Slots 1..8)</text>
    <text x="750" y="390">Guaranteed Time Slots (GTS: Slots 9..15)</text>
  </g>

  <!-- Layer 4: Wireless Spacecraft Sensor End-Devices -->
  <g>
    <!-- Sensor 1: Fairing Strain -->
    <rect x="80" y="440" width="180" height="65" rx="6" fill="url(#boxGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <text x="170" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Fairing Strain Gauge</text>
    <text x="170" y="482" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Short Addr: 0x0101 • GTS 9</text>

    <!-- Sensor 2: Solar Array Thermistor -->
    <rect x="285" y="440" width="180" height="65" rx="6" fill="url(#boxGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <text x="375" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Solar Array Thermistor</text>
    <text x="375" y="482" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Short Addr: 0x0102 • GTS 10</text>

    <!-- Sensor 3: Propellant Pressure -->
    <rect x="490" y="440" width="180" height="65" rx="6" fill="url(#boxGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <text x="580" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Propellant Pressure</text>
    <text x="580" y="482" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Short Addr: 0x0103 • GTS 11</text>

    <!-- Sensor 4: Bay Vibration -->
    <rect x="695" y="440" width="185" height="65" rx="6" fill="url(#boxGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <text x="787" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Payload Bay Vibration</text>
    <text x="787" y="482" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Short Addr: 0x0104 • GTS 12</text>
  </g>

  <!-- Connectors -->
  <line x1="480" y1="310" x2="480" y2="340" stroke="#38bdf8" stroke-width="2" />
  <line x1="170" y1="410" x2="170" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="375" y1="410" x2="375" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="580" y1="410" x2="580" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="787" y1="410" x2="787" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
</svg>
